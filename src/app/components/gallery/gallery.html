<figure class="gallery">
  <div class="gallery-viewer card">
    <img
      class="gallery-main"
      [src]="shots()[index()].src"
      [alt]="shots()[index()].alt"
      (click)="openLightbox()"
      loading="eager"
    >

    <button class="gal-arrow prev" type="button" aria-label="Previous screenshot" (click)="step(-1)">&#8249;</button>
    <button class="gal-arrow next" type="button" aria-label="Next screenshot" (click)="step(1)">&#8250;</button>

    <span class="gallery-count">{{ index() + 1 }} / {{ shots().length }}</span>
    <span class="gallery-hint">Click to enlarge</span>
  </div>

  <div class="gallery-thumbs">
    @for (shot of shots(); track shot.src; let i = $index) {
      <img
        [src]="shot.src"
        [alt]="shot.alt"
        [class.active]="i === index()"
        (click)="show(i)"
        loading="lazy"
      >
    }
  </div>

  @if (lightboxOpen()) {
    <div
      class="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Screenshot viewer"
      (click)="closeLightbox()"
    >
      <img
        class="lightbox-img"
        [src]="shots()[index()].src"
        [alt]="shots()[index()].alt"
        (click)="$event.stopPropagation()"
      >
      <button class="lightbox-close" type="button" aria-label="Close viewer" (click)="closeLightbox()">&#10005;</button>
      <button class="gal-arrow prev" type="button" aria-label="Previous screenshot" (click)="step(-1); $event.stopPropagation()">&#8249;</button>
      <button class="gal-arrow next" type="button" aria-label="Next screenshot" (click)="step(1); $event.stopPropagation()">&#8250;</button>
    </div>
  }
</figure>
